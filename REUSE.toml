# REUSE compliance configuration
# See https://reuse.software/spec-3.3/ for format specification

version = 1

[[annotations]]
SPDX-FileCopyrightText = "2026 Elio Severo Junior <elioseverojunior@gmail.com>"
SPDX-License-Identifier = "MIT OR Apache-2.0"
path = ["**"]
precedence = "aggregate"

[tool.comply]
# Custom comply settings
# `.gitignore` is GENERATED by `ignorefile generate`, which cannot emit an SPDX
# header -- so a header annotated here is stripped on the next generate and the
# `gitignore` drift gate fails. The `**` aggregate above already covers it.
ignore = ["**/target/**", "**/*.lock", ".gitignore"]
