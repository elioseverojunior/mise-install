# mise configuration ~ https://mise.jdx.dev
#
# Tool versions live in [tools] below, except Rust: its version comes from
# rust-toolchain.toml via idiomatic_version_file, keeping one source of truth.

[settings]
color = true
experimental = true
idiomatic_version_file = true
# Must name "rust" explicitly -- an empty list opts NO tool in, so mise would
# read rust-toolchain.toml and provision nothing.
idiomatic_version_file_enable_tools = ["rust"]
legacy_version_file = false
lockfile = true
not_found_auto_install = true
python.uv_venv_auto = "create|source"
quiet = true
### Debug
#verbose = true
#log_level = "debug"

[env]
ARCH = "{{exec(command='uname -m')}}"
# No GITHUB_TOKEN here: an empty value still occupies mise's third token slot and
# shadows the credential-command and OAuth sources below it. Use MISE_GITHUB_TOKEN.
PROJECT_NAME = "{{exec(command='basename $(git config --get remote.origin.url) .git || {{ config_root }}')}}"
RUST_COVERAGE_THRESHOLD = "100"
_.file = ".env"

[tools]
# rust is provisioned from rust-toolchain.toml via [settings] above — no version
# is repeated here, keeping rust-toolchain.toml the single source of truth.
"cargo:cargo-audit" = { version = "latest" }
"cargo:cargo-crap" = { version = "latest" }
"cargo:cargo-criterion" = { version = "latest" }
"cargo:cargo-deny" = { version = "latest" }
"cargo:cargo-edit" = { version = "latest" }
"cargo:cargo-fuzz" = { version = "latest" }
"cargo:cargo-machete" = { version = "latest" }
"cargo:cargo-mutants" = { version = "latest" }
"cargo:cargo-nextest" = { version = "latest" }
"cargo:cargo-pgo" = { version = "latest" }
"cargo:cargo-semver-checks" = { version = "latest" }
"cargo:cargo-sort" = { version = "latest" }
"cargo:cargo-tarpaulin" = { version = "latest" }
"cargo:cargo-update" = { version = "latest" }
"cargo:cargo-wizard" = { version = "latest" }
"cargo:committed" = { version = "latest" }
"cargo:comply" = { version = "latest" }
"cargo:flamegraph" = { version = "latest" }
"cargo:ignorefile-cli" = { version = "latest" }
"cargo:rumdl" = { version = "latest" }
"cargo:taplo-cli" = { version = "latest" }
"cargo:yamllint-rs" = { version = "latest" }

# Python
"pipx:codecov-cli" = { version = "latest" }

# Binaries registries or from sources if architecture is not supported
"aqua:hk" = { version = "latest", os = [
  "linux",
  "windows",
  "macos/arm64",
], arch = [
  "arm64",
  "x64",
], locked = false }

# Binaries from mise registries:
actionlint = { version = "latest" }
git-cliff = { version = "latest" }
gitleaks = { version = "latest" }
pkl = "latest"
scorecard = { version = "latest" }
taplo = { version = "latest" }

[hooks]
postinstall = '''
echo "Installed: $MISE_INSTALLED_TOOLS"
'''

# No `[deps.bun] auto = true`: it would run `bun install` before EVERY task, the
# Rust gates included, and CI provisions no bun. The three docs tasks that need
# the dependencies run `bun install` themselves.

[deps.cargo]
auto = true

[deps.gh]
auto = true

[tasks."act:setup"]
alias = []
description = "Create the .act/ scratch files .actrc points at (idempotent)"
hide = true
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# `if` blocks, not `[ ! -f x ] && cmd`: as a final statement that idiom exits 1
# once the file exists, which broke every run after the first.
mkdir -p .act/

if [ ! -f ".act/README.md" ]; then
  cat <<-'README' > ".act/README.md"
# [Nektos/ACT](https://nektosact.com)

This folder must not have any file commited except this README.md
README
fi

# .actrc passes --secret-file/--var-file/--eventpath unconditionally, so act
# aborts if any of these is absent. .secrets holds a live token at run time and
# is created 0600 here so it is never briefly world-readable.
for f in .act/.vars .act/.env; do
  [ -f "$f" ] || touch "$f"
done

# act 0.2.89's artifact server rejects the `mime_type` field upload-artifact v7
# sends, burning five retries on a run that otherwise passed. The workflow reads
# this variable to skip uploads. Key-guarded append, so a developer's own .vars
# entries survive and a second run adds no duplicate.
if ! grep -q '^UPLOAD_ARTIFACTS=' .act/.vars 2>/dev/null; then
  echo "UPLOAD_ARTIFACTS=false" >> .act/.vars
fi

# The act-only checkout in .github/workflows/tests/*.yml is gated on
# `vars.ACT == 'true'`. act's own ACT=true env var is not visible to `vars.*`
# (that namespace is fed exclusively by --var-file), so it has to be set here.
if ! grep -q '^ACT=' .act/.vars 2>/dev/null; then
  echo "ACT=true" >> .act/.vars
fi

if [ ! -f ".act/.secrets" ]; then
  touch .act/.secrets
  chmod 600 .act/.secrets
fi
# A populated repository stanza, not `{}`: third-party actions read
# `payload.repository.owner` and die on an empty event. Owner/name come from the
# git remote so the payload matches the real repo.
if [ ! -f ".act/event.json" ]; then
    # Parameter expansion, not sed: BSD sed has no lazy quantifier, so an ERE
    # that works on GNU fails on macOS with "repetition-operator operand invalid".
    slug=$(git remote get-url origin 2>/dev/null || true)
    slug=${slug%.git}
    slug=${slug#*://}
    slug=${slug#*@}
    slug=${slug#*:}
    name=${slug##*/}
    owner=${slug%/*}
    owner=${owner##*/}
    : "${owner:=local}"
    : "${name:=$(basename "$PWD")}"
    sha=$(git rev-parse HEAD 2>/dev/null || echo 0000000000000000000000000000000000000000)
    branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo main)
    # `commits` and `ref` matter as much as `repository`: a push-event consumer
    # reads `eventJSON.commits.length` and dies on an empty object.
    printf '%s\n' \
      '{' \
      "  \"ref\": \"refs/heads/$branch\"," \
      "  \"before\": \"$sha\"," \
      "  \"after\": \"$sha\"," \
      "  \"commits\": [ { \"id\": \"$sha\" } ]," \
      '  "repository": {' \
      "    \"name\": \"$name\"," \
      "    \"full_name\": \"$owner/$name\"," \
      "    \"default_branch\": \"$branch\"," \
      '    "private": false,' \
      "    \"owner\": { \"login\": \"$owner\", \"name\": \"$owner\" }" \
      '  }' \
      '}' > .act/event.json
fi
'''

[tasks.act]
alias = []
depends = ["act:setup"]
description = "Run a workflow locally with Nektos/act, e.g. `mise run act -w ci -j formatting`"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

workflow=".github/workflows/${usage_workflow?}.yml"
if [ ! -f "$workflow" ]; then
  echo "No such workflow: $workflow" >&2
  echo "Available:" >&2
  basename -s .yml .github/workflows/*.yml | sed 's/^/  /' >&2
  exit 1
fi

gh auth token > /dev/null 2>&1 || { echo "gh is not authenticated; run: gh auth login" >&2; exit 1; }

# `-s NAME` with no value makes act read NAME from the ENVIRONMENT. Passing
# `-s "GITHUB_TOKEN=$(gh auth token)"` puts a live token in argv, which `ps`
# exposes to every process; a secrets file is no better, since gitleaks does not
# read .gitignore and act copies the whole tree into the container.
#
# .actrc hardcodes --container-daemon-socket=/var/run/docker.sock, which does not
# exist under Docker Desktop or colima on macOS. Resolve the endpoint the docker
# CLI is actually using, falling back to the first context that answers.
socket="${DOCKER_HOST:-}"
if [ -z "$socket" ]; then
    socket=$(docker context inspect 2>/dev/null | jq -r '.[0].Endpoints.docker.Host // empty')
fi
if [ -z "$socket" ] || ! docker --host "$socket" info >/dev/null 2>&1; then
    for candidate in $(docker context ls --format json 2>/dev/null | jq -r '.DockerEndpoint // empty'); do
        if docker --host "$candidate" info >/dev/null 2>&1; then
            socket="$candidate"
            break
        fi
    done
fi
if [ -z "$socket" ] || ! docker --host "$socket" info >/dev/null 2>&1; then
    echo "No reachable Docker daemon. Start Docker Desktop or run: colima start" >&2
    exit 1
fi
echo "Using Docker daemon at $socket"

# .actrc passes --detect-event, which picks `pull_request` for a workflow with
# both triggers. Locally there is no PR, so PR-API calls 404. A working tree is a
# push, so select that explicitly whenever the workflow accepts one.
event=()
if grep -qE '^[[:space:]]*push:' "$workflow"; then
    event=(push)
fi

args=("${event[@]}" -W "$workflow" -s GITHUB_TOKEN)
# `-` disables bind-mounting the socket into the job container: none of these
# workflows talk to Docker, and under colima the mount fails outright.
# DOCKER_HOST below is what act itself connects on.
args+=(--container-daemon-socket -)
[ -n "${usage_job:-}" ] && args+=(-j "$usage_job")
# Assigned as a command prefix so the token lands in act's environment, never in
# its argv.
GITHUB_TOKEN="$(gh auth token)" DOCKER_HOST="$socket" act "${args[@]}"
'''
usage = '''
flag "-w --workflow <workflow>" help="Workflow basename under .github/workflows" default="ci" env="ACT_WORKFLOW"
flag "-j --job <job>" help="Single job id to run; omit to run the whole workflow" env="ACT_JOB"
'''

[tasks.all]
alias = []
description = "Run all local development tasks"
hide = true
run = '''
mise lock
mise run ci:fix
mise run build:install
mise run git:amend:push:force
'''

[tasks."git:ignore:check"]
alias = ["gitignore", "ignore:check"]
description = "Git Ignore Check"
hide = true
run = '''
git check-ignore -v .act/.secrets .act/.vars .act/.env .act/event.json .act/README.md
'''

[tasks."git:commit:amend"]
alias = ["git:amend", "gca"]
description = "Git Commit Saged with Amend"
hide = true
run = '''
git add -A .
git commit -S --amend --no-edit --reset-author
'''

[tasks."git:commit:push:force"]
alias = ["gpf"]
description = "Git Commit Staged with Amend"
hide = true
run = '''
git push --force-with-lease || git push --force
date
'''

[tasks."git:commit:amend:push:force"]
alias = ["gcapf", "git:amend:push:force"]
description = "Git Commit Staged with Amend"
hide = true
run = '''
mise run git:amend
mise run git:commit:push:force
date
'''

[tasks."hk:chek"]
alias = ["hook:check"]
description = "HK Hook Check"
hide = true
run = '''
hk check --all
'''

[tasks."hk:fix"]
alias = ["hook:fix"]
description = "HK Hook Fix"
hide = true
run = '''
hk fix --stage --all
'''

[tasks."worktree:add"]
alias = ["wt:add", "worktree"]
description = "Create a git worktree on a new branch with submodules initialised"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

# THE REASON THIS TASK EXISTS: `git worktree add` does not initialise submodules,
# and git offers no way to make it -- no `--recurse-submodules` on `worktree add`
# (git 2.55), and `submodule.recurse` does not cover worktree creation. The
# conformance corpus would be empty, and its harnesses no-op on an empty corpus.
branch="${usage_branch}"
base="${usage_from:-HEAD}"

# Default location is a SIBLING of the repository, never a subdirectory: a
# worktree inside the working tree is picked up by cargo's workspace glob, by
# the docs build context and by `git status` in the parent.
root="$(git rev-parse --show-toplevel)"
slug="$(printf '%s' "${branch}" | tr '/' '-')"
path="${usage_path:-${root}-wt-${slug}}"

if [ -e "${path}" ]; then
    echo "worktree:add: ${path} already exists" >&2
    exit 1
fi

git worktree add -b "${branch}" "${path}" "${base}"

# `-C`, not a `cd`: the submodule config lives in the shared .git directory, so
# this must run with the NEW worktree as the working directory.
echo "worktree:add: initialising submodules..."
git -C "${path}" submodule update --init --recursive

echo "worktree:add: ready at ${path} on ${branch}"
'''
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
arg "<branch>" help="Name of the new branch to create, e.g. fix/docs-nav"
flag "--from <from>" help="Base ref for the new branch (default: HEAD)"
flag "--path <path>" help="Worktree location (default: <repo>-wt-<branch> alongside the repo)"
'''

[tasks."setup:submodules"]
alias = ["submodules", "setup:git:submodules"]
description = "Ensure git submodules are initialised; --latest also advances each to the newest release tag in its configured family"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

# Same reason as `worktree:add`: neither `git worktree add` nor a non-recursive
# clone initialises submodules, and the conformance harnesses no-op on an empty
# corpus. `git submodule status` prefixes an UNINITIALISED entry with `-`, the
# only reliable signal -- the directory exists either way.
if git submodule status --recursive 2>/dev/null | grep -q '^-'; then
    echo "submodules: uninitialised entries found; initialising..."
    git submodule update --init --recursive
    echo "submodules: initialised"
    exit 0
fi

# Advancing the pin is OPT-IN. `[hooks] enter` calls `setup`, which depends on
# this task; moving a pinned test fixture silently on every directory change
# would make the conformance result irreproducible.
if [ "${usage_latest:-false}" != "true" ]; then
    echo "submodules: already initialised (pass --latest to advance the pin)"
    exit 0
fi

# Advance each submodule to the newest RELEASE TAG named by its
# `release-tag-glob` key in .gitmodules. NOT `git submodule update --remote`:
# that resolves `submodule.<name>.branch` against refs/remotes/*, which tags are
# never mapped into, and git ships no `submodule.<name>.tag` counterpart.
echo "submodules: looking for newer release tags..."

# One pass both advances each entry and collects `paths` for the diff report.
# The name is recovered by trimming both ends rather than with awk, since a
# submodule name is allowed to contain whitespace.
paths=()
npaths=0
while IFS= read -r key; do
    [ -n "${key}" ] || continue
    name="${key%.path}"
    name="${name#submodule.}"
    sm_path="$(git config -f .gitmodules --get "submodule.${name}.path")"
    paths+=("${sm_path}")
    npaths=$((npaths + 1))

    glob="$(git config -f .gitmodules --get "submodule.${name}.release-tag-glob" || true)"
    if [ -z "${glob}" ]; then
        echo "submodules: ${sm_path}: no release-tag-glob declared; left at its recorded pin"
        continue
    fi

    # --force lets a re-cut tag move; --prune-tags drops one deleted upstream. The
    # YAML suite squashes and force-pushes, so both matter.
    git -C "${sm_path}" fetch --quiet --prune --prune-tags --tags --force origin

    # Lexical sort IS chronological for data-YYYY-MM-DD tags. Not
    # --sort=-creatordate, under which re-cutting an old tag would jump it to the
    # head; and not -v:refname, whose versionsort reads `-` as a prerelease
    # separator once a developer sets versionsort.prereleaseSuffix.
    tag="$(git -C "${sm_path}" tag --list "${glob}" --sort=-refname | head -1)"
    if [ -z "${tag}" ]; then
        echo "submodules: ${sm_path}: no tag matches '${glob}'; left at its recorded pin"
        continue
    fi

    # Check out the TAG NAME, never its SHA: detaching at the ref is what makes
    # `git submodule status` print `(data-2022-01-17)` rather than a bare hash.
    git -C "${sm_path}" checkout --quiet --detach "refs/tags/${tag}"
    echo "submodules: ${sm_path} -> ${tag}"
done < <(git config -f .gitmodules --name-only --get-regexp '^submodule\..*\.path$')

# Scoped to the submodule PATHS: diffing the whole tree reports any unrelated edit
# as a moved pin. `git diff HEAD`, not a bare `git diff`, so a gitlink move that
# is already staged is caught too. `npaths` is an explicit counter because mise
# renders `run` as a Tera template first, and a brace-hash pair opens a Tera
# comment; `mapfile` is out for a related reason (macOS ships bash 3.2).
if [ "${npaths}" -eq 0 ]; then
    echo "submodules: none declared in .gitmodules"
elif git diff HEAD --quiet -- "${paths[@]}"; then
    echo "submodules: already on the newest release tag; nothing moved"
else
    echo "submodules: the pin MOVED -- review and commit it deliberately:"
    git diff HEAD --submodule=short -- "${paths[@]}" | sed 's/^/    /'
fi
'''
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
flag "--latest" help="If already initialised, advance each submodule to the newest release tag matching its .gitmodules release-tag-glob (moves the pin and dirties the tree)"
'''

# === Tool Installation ===
[tasks.setup]
alias = ["install", "dev", "dev:setup", "dev:up"]
depends = ["setup:submodules"]
description = "Install tools, sourcing from Homebrew when it matches the pin"
run = '''
set -eo pipefail

# Homebrew is preferred on macOS, but ONLY when its installed version already
# equals the pin in [tools]: none of these ship a versioned formula, so brew
# tracks whatever is current. On any mismatch the pin wins. Formula names only;
# versions are read back from [tools].
BREW_TOOLS="git-cliff gitleaks gh jq rustup scorecard uv yq"

root="$(git rev-parse --show-toplevel)"
local_cfg="$root/mise.local.toml"

# An empty MISE_DISABLE_TOOLS overrides mise.local.toml so the lockfile is always
# written from the FULL toolset: a disabled tool is omitted from mise.lock, and a
# brew machine committing that would leave non-brew machines unresolvable.
MISE_DISABLE_TOOLS= mise lock

have_brew=no
if [ "$(uname -s)" = "Darwin" ] && command -v brew >/dev/null 2>&1; then
  have_brew=yes
fi

# One batched call: six separate `brew list` invocations cost roughly 5x more.
brew_versions() {
  [ "$have_brew" = yes ] || return 0
  brew list --versions $BREW_TOOLS 2>/dev/null | sort || true
}

# `mise ls --current` merges the global config, so intersecting with BREW_TOOLS
# below keeps this to the project's own tools.
pins="$(MISE_DISABLE_TOOLS= mise ls --current --json | jq -r 'to_entries[] | "\(.key) \(.value[0].requested_version)"' | sort)"

# Fingerprint every input that decides this file's content. Hashing mise.lock
# alone is NOT sufficient: Homebrew moving swiftlint 0.65.0 -> 0.66.0 must force
# a rewrite, and nothing about that touches the lockfile.
fingerprint() {
  printf '%s\n' \
    "v1" "$(uname -s)" "$(uname -m)" "$have_brew" "$pins" "$(brew_versions)" \
    "$(shasum -a 256 "$root/mise.lock" 2>/dev/null | cut -d" " -f1)" \
    | shasum -a 256 | cut -d" " -f1
}

# `mise install` can settle new entries into mise.lock, leaving the fingerprint
# just written stale. Re-stamping afterwards converges the cache in one run.
refresh_fp() {
  [ -f "$local_cfg" ] || return 0
  local now tmp
  now="$(fingerprint)"
  if grep -qF "# fingerprint: $now" "$local_cfg"; then
    return 0
  fi
  tmp="$(mktemp)"
  awk -v fp="$now" '/^# fingerprint: /{ print "# fingerprint: " fp; next } { print }' "$local_cfg" > "$tmp"
  mv "$tmp" "$local_cfg"
}

fp="$(fingerprint)"
if [ -f "$local_cfg" ] && grep -qF "# fingerprint: $fp" "$local_cfg"; then
  echo "mise.local.toml up to date ($(printf '%s' "$fp" | cut -c1-12))"
  mise install
  mise deps
  refresh_fp
  exit 0
fi

lookup() { printf '%s\n' "$2" | awk -v t="$1" '$1 == t { print $2 }'; }

brewed=""
installed_any=no
if [ "$have_brew" = yes ]; then
  state="$(brew_versions)"
  missing=""

  for f in $BREW_TOOLS; do
    pin="$(lookup "$f" "$pins")"
    [ -n "$pin" ] || continue
    inst="$(lookup "$f" "$state")"

    if [ -z "$inst" ]; then
      missing="$missing $f"
    elif [ "$pin" = "latest" ] || [ "$pin" = "$inst" ]; then
      brewed="$brewed $f"
      echo "brew $f $inst"
    else
      echo "mise $f $pin (Homebrew has $inst)"
    fi
  done

  # Only tools that are not installed yet need the slow formula API, and they
  # are queried in a single batched call.
  if [ -n "$missing" ]; then
    stables="$(brew info --json=v2 $missing 2>/dev/null | jq -r '.formulae[] | "\(.name) \(.versions.stable)"' || true)"
    for f in $missing; do
      pin="$(lookup "$f" "$pins")"
      stable="$(lookup "$f" "$stables")"
      if [ -n "$stable" ] && { [ "$pin" = "latest" ] || [ "$pin" = "$stable" ]; }; then
        brew install "$f"
        brewed="$brewed $f"
        installed_any=yes
        echo "brew $f $stable (installed)"
      else
        echo "mise $f $pin${stable:+ (Homebrew has $stable)}"
      fi
    done
  fi
fi

# Installing changed what brew reports, so the fingerprint must be recomputed or
# the next run would see a mismatch and redo all of this for nothing.
[ "$installed_any" = yes ] && fp="$(fingerprint)"

# disable_tools makes mise step aside so its shims stop shadowing Homebrew's
# bin. Machine-specific, hence mise.local.toml rather than mise.toml.
{
  echo "# Generated by \`mise run install\` - machine-specific, not committed."
  echo "# fingerprint: $fp"
  if [ -n "$brewed" ]; then
    echo "# Tools Homebrew satisfies at the pinned version; mise handles the rest."
    echo "[settings]"
    printf 'disable_tools = ['
    sep=""
    for f in $brewed; do
      printf '%s"%s"' "$sep" "$f"
      sep=", "
    done
    printf ']\n'
  fi
  # hk ships a darwin/arm64 build but no darwin/amd64 one, and mise has no way
  # to gate a tool on architecture (see the [tools] comment). Adding it here
  # keeps Apple Silicon covered without breaking Intel Macs.
  if [ "$(uname -s)" = "Darwin" ] && [ "$(uname -m)" = "arm64" ]; then
    echo '[tools]'
    echo '"aqua:hk" = { version = "latest", locked = false }'
  fi
} > "$local_cfg"

mise lock
mise install
mise deps
refresh_fp
'''
shell = "bash -c"

[tasks."git:hooks:install"]
alias = []
description = "Install the git hooks managed by hk (global install for Git 2.54+)"
run = "hk install"

[tasks."git:hooks:install:global"]
alias = []
description = "Install the git hooks managed by hk (global install for Git 2.54+)"
run = "mise run git:hooks:install --global"

[tasks."git:hooks:install:local"]
alias = []
description = "Install the git hooks managed by hk (global install for Git 2.54+)"
run = "mise run git:hooks:install --force-local"

# -- Local release tags --
#
# Two kinds of tag from one version. The exact tag (`v0.0.1-1`) names a unique
# point in history and is created once; the floating tags (`v0.0.1`, `v0.0`, `v0`)
# move to the newest release sharing those leading numbers. They are derived from
# the exact tag by string surgery, so an explicitly named tag floats identically.
# Neither task pushes: publishing a tag is a separate, deliberate act.

[tasks."git:tag:create"]
alias = ["tag:create"]
description = "Create a signed, annotated tag locally and move the floating tags onto it. Never pushes"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

TAG="${usage_tag:-$(mise run version:tag)}"

if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
    echo "error: tag ${TAG} already exists; delete it first:" >&2
    echo "       mise run git:tag:delete ${TAG}" >&2
    exit 1
fi

# A tag names a commit, so uncommitted work is not in what gets tagged. Worth
# saying out loud, not worth refusing over.
if [ -n "$(git status --porcelain)" ]; then
    echo "warning: working tree is dirty -- ${TAG} points at HEAD, without those changes." >&2
fi

git tag -s "${TAG}" -m "${usage_message:-${TAG}}"
echo "created ${TAG} at $(git rev-parse --short HEAD); local only, not pushed"

if [ "${usage_exact:-}" = "true" ]; then
    exit 0
fi

# -f because floating tags exist to be repointed; a tag equal to the exact one
# (a SemVer with no pre-release) is skipped rather than force-rewritten.
for float in $(mise run version:tags:floating "${TAG}"); do
    if [ "${float}" != "${TAG}" ]; then
        git tag -f -s "${float}" -m "${float}" >/dev/null
        echo "moved ${float} -> $(git rev-parse --short HEAD)"
    fi
done
'''
shell = "bash -c"
usage = '''
arg "[tag]" help="exact tag name, e.g. v0.0.1-1; defaults to the version:tag derivation"
flag "-m --message <message>" help="annotation message; defaults to the tag name"
flag "--exact" help="create only the exact tag; leave the floating tags where they are"
'''

[tasks."git:tag:delete"]
alias = ["tag:delete"]
description = "Delete a LOCAL tag by name. Never touches a remote"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# The tag is NAMED, never derived: `version:tag` reads gitversion, which reads the
# tags -- so once `git:tag:create` lands `v0.0.1`, the derivation stops answering
# `v0.0.1-1` and a guessing delete would remove the wrong tag.
TAG="${usage_tag}"

if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
    echo "error: no local tag ${TAG}." >&2
    exit 1
fi

git tag -d "${TAG}"

# Floating tags are NOT removed by default: `v0` points at whichever release is
# newest, which is usually not the one being deleted, so taking it away would
# drop a pointer to a release this command never touched.
if [ "${usage_floating:-}" = "true" ]; then
    for float in $(mise run version:tags:floating "${TAG}"); do
        if [ "${float}" != "${TAG}" ] && git rev-parse -q --verify "refs/tags/${float}" >/dev/null; then
            git tag -d "${float}"
        fi
    done
fi
'''
shell = "bash -c"
usage = '''
arg "<tag>" help="exact tag name to delete, e.g. v0.0.1-1 (required; never derived)"
flag "--floating" help="also delete the floating tags that this version would move"
'''

# GitVersion derives the version from the TAG GRAPH, and `git fetch` does NOT
# update a tag that already exists locally -- so a tag rewritten upstream stays
# pinned to the old commit forever, silently, and local and CI resolve different
# versions from the same commit.
#
# Never fatal: a version task has to keep working offline and in a clone with no
# remote.
[tasks."git:tags:fetch"]
alias = []
description = "Force-refresh tags from origin so GitVersion sees the graph CI sees"
hide = true
run = '''
#!/usr/bin/env bash
set -Eeuo pipefail

git rev-parse --git-dir >/dev/null 2>&1 || exit 0
git remote get-url origin >/dev/null 2>&1 || exit 0

# `--force` is the whole point: without it git leaves an existing tag alone and
# the refresh is a no-op precisely when it matters.
git fetch --tags --force --quiet origin 2>/dev/null || {
    echo "version: could not reach origin; tags may be stale and the computed version wrong" >&2
    exit 0
}
'''
shell = "bash -c"

# Plumbing: every other version task sources this, nobody runs it directly.
# Failure is not fatal -- an empty object beats refusing to answer.
[tasks."version:json"]
alias = []
# Every version answer routes through here, so refreshing tags at this one point
# makes all of them correct by construction.
depends = ["git:tags:fetch"]
description = "Print the GitVersion JSON for the working tree, or an empty object"
hide = true
run = '''
#!/usr/bin/env bash
set -eo pipefail
# `/nocache` because GitVersion's cache invalidates on the COMMIT, not the tag
# graph -- `git:tag:create` moves tags onto the current commit, so a cached entry
# is served exactly when the answer changed. `AssemblySemVer`/`AssemblySemFileVer`
# are .NET four-part versions nothing in a Rust project consumes.
gitversion /nocache /output json \
  | jq -Sr 'del(.AssemblySemVer, .AssemblySemFileVer) + {MajorMinor: "\(.Major).\(.Minor)"}' \
    2>/dev/null || echo '{}'
'''

# The exact tag name the `git:tag:*` tasks default to. `MajorMinorPatch`, NOT
# `SemVer`: SemVer appends a commit counter as a pre-release identifier, which
# makes the whole version a SemVer PRE-RELEASE -- crates.io then tracks
# max_stable_version separately and `cargo add mise-install` resolved the empty
# `0.0.0` placeholder instead of the real library.
[tasks."version:tag"]
alias = []
description = "Print the exact tag name derived from version:json, e.g. v0.0.1-1"
hide = true
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

VERSION="$(mise run version:json | jq -r '.MajorMinorPatch // empty')"

# Empty means version:json fell back to `{}` -- gitversion is missing or refused
# the tree. Tagging `vnull` from that is worse than stopping.
if [ -z "${VERSION}" ]; then
    echo "error: version:json supplied no MajorMinorPatch; is gitversion installed?" >&2
    echo "       Name the tag explicitly, e.g. mise run git:tag:create v0.0.1-1" >&2
    exit 1
fi

echo "v${VERSION}"
'''
shell = "bash -c"

# The floating tag names for a version, newest-first: `v0.0.1`, `v0.0`, `v0`.
# Derived from the tag STRING rather than from `version:json` fields, so an
# explicitly named tag floats exactly like a derived one.
[tasks."version:tags:floating"]
alias = []
description = "Print the floating tag names for a version, e.g. v0.0.1 v0.0 v0"
hide = true
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

TAG="${usage_tag:-$(mise run version:tag)}"

# v0.0.1-1 -> 0.0.1: drop the leading v, then the pre-release/build suffix.
BASE="${TAG#v}"
BASE="${BASE%%[-+]*}"

IFS='.' read -r MAJOR MINOR _ <<<"${BASE}"
MINOR="${MINOR:-0}"

# A version like `0.0` yields `v0.0` twice; emit each name once.
printf 'v%s\nv%s.%s\nv%s\n' "${BASE}" "${MAJOR}" "${MINOR}" "${MAJOR}" | awk '!seen[$0]++'
'''
shell = "bash -c"
usage = 'arg "[tag]" help="tag to derive from, e.g. v0.0.1-1; defaults to the version:tag derivation"'

[tasks.version]
alias = ["semver"]
description = "Print GitVersion's MajorMinorPatch for the working tree, e.g. 0.1.0 (the release input; NOT what the committed files are gated against -- see version:check)"
run = "mise run version:json | jq -r '.MajorMinorPatch'"

[tasks."version:sync"]
alias = []
description = "Write the Cargo.toml [workspace.package] version into every file that restates it; pass --check to report drift instead of writing"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# Cargo.toml's [workspace.package] version is the anchor: it is what `cargo
# publish` uploads, and it moves only on a deliberate bump. `mise run version` is
# deliberately NOT the anchor -- that is GitVersion's derivation for the NEXT
# release, which the committed files adopt only when a bump is cut.
#
# Only files that CLAIM the current version are touched: a repo-wide substitution
# would rewrite the `e.g. v0.0.1-1` examples in this file's own help text. Where a
# site is discovered rather than listed, its pattern is pinned to a shape only a
# real declaration can have (`^<crate> = "`), so CHANGELOG headings and README
# examples that assert on their own digits are never candidates.
# `[workspace.package]` in a workspace manifest, `[package]` in a single-crate
# one. Tried in that order rather than assumed -- taplo exits non-zero on a key
# that is not there, so an unguarded read fails the whole gate on a repo that
# simply has the other shape.
if ! anchor="$(taplo get -f Cargo.toml '.workspace.package.version' 2>/dev/null)"; then
    anchor="$(taplo get -f Cargo.toml '.package.version')"
fi
checking="${usage_check:-false}"
from_git="${usage_from_git:-false}"
drift=0

# Reads are structured (taplo, jq); writes are anchored substitutions through a
# temp file, because taplo has no `set` and `sed -i` spells its backup argument
# incompatibly on macOS and GNU.
edit() {
    local file="$1" script="$2" tmp
    tmp="$(mktemp)"
    sed -E "$script" "$file" >"$tmp" && mv "$tmp" "$file"
}

# True when the site disagrees. Records rather than exits, so one run reports
# every stale site instead of stopping at the first.
stale() {
    local label="$1" found="$2" want="$3"
    if [ "$found" = "$want" ]; then
        return 1
    fi
    if [ "$checking" = true ]; then
        printf 'version drift: %s has "%s", expected "%s"\n' "$label" "$found" "$want" >&2
        drift=1
    else
        printf 'version: %s "%s" -> "%s"\n' "$label" "$found" "$want"
    fi
    return 0
}

# `--from-git` moves the anchor itself, so a release bump is computed rather than
# hand-edited. `MajorMinorPatch`, matching `version:tag` -- one field feeds both
# the files and the tag, so neither can drift from the other.
#
# It replaced `SemVer`, whose commit counter made every version a SemVer
# PRE-RELEASE (so `cargo add` resolved the wrong thing) and was self-referential:
# writing `0.1.0-10` and then adding a commit landed that string at count 11.
if [ "$from_git" = true ]; then
    computed="$(mise run version:json | jq -r '.MajorMinorPatch // empty')"
    if [ -z "$computed" ]; then
        echo "version: gitversion produced no MajorMinorPatch; is it installed?" >&2
        exit 1
    fi
    if stale "Cargo.toml package version" "$anchor" "$computed"; then
        # `^version = "` matches the [workspace.package] key alone: `rust-version`
        # does not start the line with `version`, and the dependency entries spell
        # it inline inside a table.
        [ "$checking" = true ] || edit Cargo.toml \
            "s|^(version = \")[^\"]*(\")|\1${computed}\2|"
    fi
    anchor="$computed"
fi

# `cargo publish` rejects a path dependency whose `version` disagrees with the
# crate it resolves to, so these are load-bearing rather than cosmetic.
# Discovered from the dependency table rather than listed; selecting on `path`
# picks exactly the LOCAL crates and skips registry ones.
# Guarded: a single-crate manifest has no [workspace.dependencies] at all, and
# taplo treats a missing table as an error rather than an empty result.
deps=""
if dep_json="$(taplo get -f Cargo.toml -o json '.workspace.dependencies' 2>/dev/null)"; then
    deps="$(printf '%s' "$dep_json" | jq -r 'to_entries[] | select(.value.path) | .key')"
fi
for dep in $deps; do
    found="$(taplo get -f Cargo.toml ".workspace.dependencies.${dep}.version")"
    if stale "Cargo.toml [workspace.dependencies] ${dep}" "$found" "$anchor"; then
        [ "$checking" = true ] || edit Cargo.toml \
            "s|^(${dep} = .*version = \")[^\"]*(\")|\1${anchor}\2|"
    fi
done

# Guarded like the sites below it: a repo with no docs site has no
# docs/package.json, and jq on a missing file fails the whole gate.
if [ -f docs/package.json ]; then
    found="$(jq -r '.version' docs/package.json)"
    if stale "docs/package.json .version" "$found" "$anchor"; then
        [ "$checking" = true ] || edit docs/package.json \
            "s|^(  \"version\": \")[^\"]*(\")|\1${anchor}\2|"
    fi
fi

# Markdown restates the version tag-style, with the leading `v`. The `-N` suffix
# is OPTIONAL in the pattern: made mandatory, a release version like 0.1.0 fails
# to match, `found` comes back empty and the file is silently skipped. The
# `[ -e ]` guard keeps the loop correct while no doc restates the version yet.
for doc in docs/reference/cli.md; do
    [ -e "$doc" ] || continue
    found="$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' "$doc" | sort -u | tr '\n' ' ')"
    found="${found% }"
    [ -n "$found" ] || continue
    if stale "$doc" "$found" "v${anchor}"; then
        [ "$checking" = true ] || edit "$doc" \
            "s|v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?|v${anchor}|g"
    fi
done

# Install snippets restate the version as a Cargo REQUIREMENT -- `mise-install = "0.2"`,
# not `"0.2.1"` and not `"v0.2.1"`. The right requirement is the loosest that
# still excludes breaking changes: `0.MINOR` while the crate is 0.x, bare `MAJOR`
# from 1.0 on. Pinning the patch would rewrite every README on every release.
case "$anchor" in
    0.*) req="${anchor%.*}" ;;
    *) req="${anchor%%.*}" ;;
esac

# Discovered rather than listed, like the dependency table above. The `^` anchor is
# the whole safety argument: this repo is full of version-shaped strings that MUST
# NOT be rewritten (CHANGELOG headings, a README example whose next line asserts
# on those digits). Requiring `^<crate> = "` matches the dependency form alone.
while IFS= read -r doc; do
    [ -e "$doc" ] || continue
    found="$(sed -nE 's/^mise-install[a-z-]* = "([^"]+)".*/\1/p' "$doc" | sort -u | tr '\n' ' ')"
    found="${found% }"
    [ -n "$found" ] || continue
    if stale "${doc} mise-install requirement" "$found" "$req"; then
        [ "$checking" = true ] || edit "$doc" \
            "s|^(mise-install[a-z-]* = \")[^\"]*(\")|\1${req}\2|"
    fi
done < <(git ls-files '*.md')

if [ "$drift" -ne 0 ]; then
    echo "Run \`mise run version:sync\` to align them with Cargo.toml." >&2
    exit 1
fi
'''
shell = "bash -c"
usage = '''
flag "--check" help="report drift and exit non-zero instead of writing"
flag "--from-git" help="move the anchor to GitVersion's SemVer first, computing the release version instead of hand-editing Cargo.toml; amend rather than adding a commit, or the counter goes stale"
'''

[tasks."version:check"]
alias = ["version:drift"]
description = "Drift guard: fail if any file restating the version disagrees with Cargo.toml (run by the pre-commit hook and safe to run in CI)"
run = "mise run version:sync --check"

[tasks.doc]
alias = ["d"]
description = "Build the API docs (private items included, no deps) to catch broken intra-doc links"
run = "cargo doc --all-features --no-deps --document-private-items"

[tasks."doc:open"]
alias = ["do", "dh", "doc:html"]
depends = ["doc"]
description = "Open the API docs `doc` built in the default browser (macOS, Linux or Windows)"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

page="target/doc/mise_install/index.html"

# Dispatched on `uname`, not on which opener happens to be installed: `open` is an
# unrelated command on some Linux distributions. $BROWSER comes first regardless
# -- it is the only correct answer when there is no local display.
if [ -n "${BROWSER:-}" ]; then
    "${BROWSER}" "${page}"
else
    case "$(uname -s)" in
        Darwin) open "${page}" ;;
        Linux) xdg-open "${page}" ;;
        # `start` is a cmd builtin, so it cannot be invoked directly from bash. The
        # empty "" is the window TITLE argument; `//c` survives MSYS path mangling.
        MINGW* | MSYS* | CYGWIN*) cmd.exe //c start "" "${page}" ;;
        *)
            echo "doc:open: no known opener for $(uname -s). Docs are at ${page}" >&2
            exit 1
            ;;
    esac
fi
'''
shell = "bash -c"

[tasks."profile:check"]
alias = []
description = "Fail if any Cargo.toml declares a [profile.*] block (profiles live in .cargo/config.toml)"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# `.cargo/config.toml` is the single source of truth for build profiles, and this
# gate is what makes that true rather than merely intended: cargo resolves a
# manifest/config conflict in favour of the CONFIG, and does so SILENTLY -- a
# `[profile.release]` in a manifest simply never reaches rustc. Every manifest is
# checked, not just the root, and the INDEX is judged rather than the working
# tree, so a partially staged fix cannot make it pass.
if ! git rev-parse --git-dir >/dev/null 2>&1; then
    echo "profile:check: not a git repository, nothing staged to judge." >&2
    exit 0
fi

staged="$(mktemp -d)"
trap 'rm -rf "${staged}"' EXIT
git checkout-index --all --prefix="${staged}/"

found=0
while IFS= read -r manifest; do
    # Anchored: a commented-out or nested mention is not a declaration.
    if hits="$(grep -nE '^\[profile(\.|\])' "${manifest}" 2>/dev/null)"; then
        echo "profile:check: ${manifest#"${staged}"/} declares a build profile:" >&2
        printf '%s\n' "${hits}" | sed 's/^/    /' >&2
        found=1
    fi
done < <(find "${staged}" -name Cargo.toml -not -path '*/target/*' | sort)

if [ "${found}" -ne 0 ]; then
    cat >&2 <<'MSG'

Build profiles belong in .cargo/config.toml, which silently outranks the
manifest -- a profile left here would never reach rustc. Move the block there,
or delete it if .cargo/config.toml already covers it.
MSG
    exit 1
fi
'''
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Print each manifest as it is checked"
'''

[tasks."cargo:lock:check"]
alias = []
description = "Fail if Cargo.lock is out of date relative to Cargo.toml (run `cargo update` to refresh)"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# Judges the INDEX, not the working tree: `audit` and `deny` invoke cargo, and
# cargo repairs a stale Cargo.lock in place -- so a working-tree check passed on a
# file an earlier hook step had already fixed while the STAGED lock went into the
# commit still stale.
#
# `--locked` on a read-only command, not `cargo update --dry-run | grep -q`: that
# closed the pipe, cargo died on EPIPE, and pipefail promoted the status so the
# check passed precisely when the lockfile WAS stale.
if ! git rev-parse --git-dir >/dev/null 2>&1; then
    echo "cargo:lock:check: not a git repository, nothing staged to judge." >&2
    exit 0
fi

staged="$(mktemp -d)"
trap 'rm -rf "${staged}"' EXIT
git checkout-index --all --prefix="${staged}/"

if ! report="$(cargo metadata --locked --format-version 1 \
    --manifest-path "${staged}/Cargo.toml" 2>&1 >/dev/null)"; then
    echo "Cargo.lock is out of date as staged -- run 'cargo update', then stage it." >&2
    # Rewritten to repo-relative: cargo names the scratch copy, and a /var/folders
    # path in the message reads as a different file.
    printf '%s\n' "${report}" | sed "s|${staged}/||g" >&2
    exit 1
fi
'''
shell = "bash -c"

