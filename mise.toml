[tasks."bench:bencher"]
alias = []
description = "Benchmarks in libtest/bencher format (the performance.yml gate's output shape); skips cleanly until a benches/ target exists"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# No benches/ directory anywhere means nothing to measure, so skip cleanly --
# consistent with the fuzz/flame graceful-skip tasks.
#
# Searched from the repo root, not under `crates/`. Both layouts have to
# match: `crates/*/benches` is the workspace shape, while a single-crate repo
# puts `benches/` at the root -- and looking only under `crates/` made this
# skip unconditionally there, reporting "no benches" for a repo that has them,
# which is the one answer a gate must never give. `target/` is pruned because
# a build leaves `benches` directories inside it.
if ! find . -type d -name benches -not -path './target/*' -not -path './.git/*' 2>/dev/null | grep -q .; then
    echo "bench-bencher: skipping — no benches/ directory found." >&2
    exit 0
fi
cargo bench --workspace -- --output-format bencher | tee bench-output.txt
grep -q "ns/iter" bench-output.txt || { echo "::error:: no ns/iter lines emitted"; exit 1; }
echo "Parsed $(grep -c 'ns/iter' bench-output.txt) measurements."
'''
shell = "bash -c"

# -- Fuzz (single-target run lives in [tasks.fuzz] above) --

[tasks."fuzz:all"]
alias = []
description = "Run every cargo-fuzz target sequentially (FUZZ_TIME seconds each, default 60). Requires nightly — see `mise run rustup:nightly`. Skips cleanly when no fuzz/ targets exist"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# Mirror the single-target `fuzz` guard: no fuzz/ directory means no targets.
# Targets are discovered dynamically so this never drifts from fuzz_targets/, and
# each is fuzzed for FUZZ_TIME seconds.
if [ ! -d fuzz ]; then
    echo "fuzz:all: skipping — no fuzz/ directory (no targets yet)." >&2
    exit 0
fi
time_budget="${FUZZ_TIME:-60}"
# `--target` is NOT optional. cargo-fuzz bakes its default triple in at ITS OWN
# build time, and cargo-binstall serves the statically linked build -- so on a gnu
# Linux host that retargets to musl and fails twice over: "sanitizer is
# incompatible with statically linked libc" and "can't find crate for `core`".
host="$(rustc +nightly -vV | awk '/^host:/{print $2}')"
for target in $(cargo +nightly fuzz list); do
  echo "▶ fuzzing ${target} for ${time_budget}s on ${host}"
  cargo +nightly fuzz run "$target" --target "$host" -- -max_total_time="$time_budget"
done
'''
shell = "bash -c"

