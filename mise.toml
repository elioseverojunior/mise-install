[tasks."cargo:audit"]
alias = []
description = "Audit dependencies for known security advisories (RustSec) with cargo-audit (reads .cargo/audit.toml)"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# cargo-audit and cargo-deny both default to $CARGO_HOME/advisory-db, and
# cargo-audit refuses to clone into a directory that exists but is not a valid
# checkout. hk runs the two steps CONCURRENTLY, so whichever lost the race met a
# half-written directory. Giving audit its own database removes the shared state.
db="${CARGO_HOME:-${HOME}/.cargo}/advisory-db-audit"

# Belt and braces for the cache-restore case: a directory that is not a valid
# clone is unusable to cargo-audit, and re-cloning is cheap next to a failed run.
if [ -d "${db}" ] && ! git -C "${db}" rev-parse --git-dir >/dev/null 2>&1; then
    echo "cargo:audit: ${db} is not a valid clone; removing it before fetch." >&2
    rm -rf "${db}"
fi

cargo audit --db "${db}" ${args[@]+"${args[@]}"}
'''
shell = "bash -c"
usage = '''
arg "[args]" var=#true help="Extra arguments forwarded to cargo-audit"
'''

