[tasks."coverage:sarif"]
alias = ["cov:sarif", "sarif"]
depends = ["coverage"]
depends_post = []
description = "Convert the lcov.info produced by tarpaulin into SARIF for code-scanning upload"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# Same source of truth tarpaulin reads; without it cargo-crap warns about the
# files coverage deliberately omits. An explicit loop rather than an array-length
# expansion, which opens a Tera comment in a mise run block.
EXCLUDES=()
while IFS= read -r glob; do
  [ -n "$glob" ] && EXCLUDES+=(--exclude "$glob")
done < <(RUST_LOG=error taplo get -f tarpaulin.toml 'default.exclude-files')

if [ -z "${EXCLUDES[*]:-}" ]; then
  echo "Could not read exclude-files from tarpaulin.toml" >&2
  exit 1
fi

cargo crap --lcov lcov.info --format sarif "${EXCLUDES[@]}" > results.sarif
'''
shell = "bash -c"


[tasks."docker:build"]
alias = ["docker-build", "db", "dkr-b", "dkr:build"]
description = "Build a Docker image using multi-stage Dockerfile with buildx"
run = '''
#!/usr/bin/env bash
set -Eeuo pipefail

# `sed`, not `grep -oP`: BSD grep (the macOS default) has no `-P`, so both lookups
# failed and the `||` fallbacks silently supplied a wrong version label.
RUST_VERSION=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml 2>/dev/null \
  || sed -n 's/^rust-version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml 2>/dev/null)
RUST_VERSION="${RUST_VERSION:-1.97}"
APP_VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml 2>/dev/null)
APP_VERSION="${APP_VERSION:-0.1.0}"

# Overrides the BUILD base only. A single shared `IMAGE_TAG` also reached the
# Dockerfile's runtime `debian:` FROM and asked for `debian:1.97-trixie`.
IMAGE_TAG_BUILD="${RUST_VERSION}-trixie"
DOCKER_TAG="${usage_tag:-mise-install:${APP_VERSION}}"
DOCKERFILE="${usage_file:-docker/Dockerfile}"

BUILD_ARGS=()
eval "extra_args=(${usage_build_arg:-})"
for arg in "${extra_args[@]}"; do
  BUILD_ARGS+=("--build-arg" "$arg")
done

docker buildx build \
  --pull \
  --build-arg "IMAGE_TAG_BUILD=${IMAGE_TAG_BUILD}" \
  "${BUILD_ARGS[@]}" \
  -f "$DOCKERFILE" \
  -t "$DOCKER_TAG" \
  --progress plain \
  .
'''
shell = "bash -c"
usage = '''
flag "-b --build-arg <build_arg>" help="Additional build arg values" var=#true
flag "-t --tag <tag>" help="Docker image tag override"
flag "-f --file <file>" help="Dockerfile path override" default="docker/Dockerfile"
'''

[tasks."docker:ignore:verify"]
alias = ["div"]
description = "Build an ephemeral Docker image with .dockerignore and verify that only the expected files land in the build context"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

if ! docker buildx version &>/dev/null; then
    echo "dockerignore-verify: Docker buildx is not available -- skipping." >&2
    exit 0
fi

# Create an ephemeral Dockerfile that lists every file in the build context.
TMPFILE=$(mktemp /tmp/${PROJECT_NAME}-dockerignore-test-XXXXXXXXXX.Dockerfile)
trap 'rm -f "$TMPFILE"' EXIT

cat > "$TMPFILE" << 'DOCKERFILE'
FROM busybox:latest
WORKDIR /ctx
COPY . .
RUN find /ctx -type f | sort | tee /tmp/files.txt
CMD ["cat", "/tmp/files.txt"]
DOCKERFILE

TAG="${PROJECT_NAME}-dockerignore-verify:latest"

echo "--- Building ephemeral image (buildx + .dockerignore) ---"
if ! docker buildx build \
    --file "$TMPFILE" \
    --load \
    --tag "$TAG" \
    --progress plain \
    . 2>&1; then
    echo "ERROR: docker buildx build failed." >&2
    exit 1
fi

echo ""
echo "--- Files in build context (after .dockerignore) ---"
CONTEXT_FILES=$(docker run --rm "$TAG" 2>&1)
echo "$CONTEXT_FILES"

echo ""
echo "--- Verifying .dockerignore ---"

# Expected: essential build files MUST be present
for f in "Cargo.toml" "Cargo.lock" "rust-toolchain.toml"; do
    if echo "$CONTEXT_FILES" | grep -q "/ctx/$f"; then
        echo "  [ok]   $f present"
    else
        echo "  [FAIL] $f MISSING from build context!"
        FAIL=1
    fi
done

# Check that key directories exist
for d in "src/lib.rs" "src/main.rs" ".cargo/config.toml"; do
    if echo "$CONTEXT_FILES" | grep -q "/ctx/$d"; then
        echo "  [ok]   $d present"
    else
        echo "  [FAIL] $d MISSING from build context!"
        FAIL=1
    fi
done

# `.git` is DELIBERATELY not in this list: a build.rs can stamp a real
# GIT_COMMIT from it. It is checked as a REQUIRED-present path instead, below.
if echo "$CONTEXT_FILES" | grep -q "/ctx/.git/HEAD"; then
    echo "  [ok]   .git present (needed for GIT_COMMIT provenance)"
else
    echo "  [FAIL] .git MISSING from build context -- GIT_COMMIT will report 'unknown'!"
    FAIL=1
fi

# Excluded directories: these MUST be absent from context root
for pat in "target" "docs" "scripts" "tests" "worktrees" ".DS_Store" "__pycache__" ".idea" ".vscode"; do
    if echo "$CONTEXT_FILES" | grep -Eq "^/ctx/$pat(/|$)"; then
        echo "  [FAIL] $pat should have been EXCLUDED by .dockerignore!"
        FAIL=1
    else
        echo "  [ok]   $pat excluded"
    fi
done

# Root-level excluded files
for f in "AGENTS.md" "context.md" "CHANGELOG.md" "deny.toml" "hk.pkl" "cobertura.xml" "lcov.info" "results.sarif" "REUSE.toml" "mise.toml" "rustfmt.toml" ".clippy.toml"; do
    if echo "$CONTEXT_FILES" | grep -Eq "^/ctx/$f$"; then
        echo "  [FAIL] $f should have been EXCLUDED by .dockerignore!"
        FAIL=1
    else
        echo "  [ok]   $f excluded"
    fi
done

# Subdirectory .md files: **/*.md must exclude things like crates/*/README.md
if echo "$CONTEXT_FILES" | grep -Eq "^/ctx/crates/[^/]+/README\.md$"; then
    echo "  [FAIL] crates/*/README.md should have been EXCLUDED by **/*.md!"
    FAIL=1
else
    echo "  [ok]   crates/*/README.md excluded via **/*.md"
fi

echo ""
if [ -n "${FAIL:-}" ]; then
    echo "FAIL: .dockerignore verification failed."
    docker image rm "$TAG" > /dev/null 2>&1 || true
    exit 1
fi

echo "PASS: .dockerignore is correctly filtering the build context."
docker image rm "$TAG" > /dev/null 2>&1 || true
'''
shell = "bash -c"

[tasks."test:conformance"]
alias = ["conformance", "yaml-suite", "test:yaml-suite"]
description = "Run the official YAML test suite and the round-trip fidelity property against the pinned snapshot, without coverage instrumentation"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

# No conformance crate in this repo yet, so there is nothing to run and the
# task skips cleanly -- consistent with the fuzz/bench graceful-skip tasks.
# Point CONFORMANCE_CRATE at one to enable it.
#
# The guard checks for CONTENT, not existence: a suite carried as a git
# submodule leaves its directory present but EMPTY after `git worktree add` or
# a non-recursive clone, and a harness that opens with
# `if !data_dir.exists() { return; }` then PASSES having asserted nothing.
crate="${CONFORMANCE_CRATE:-}"
if [ -z "${crate}" ]; then
    echo "test:conformance: skipping — no conformance crate configured." >&2
    exit 0
fi

data="crates/${crate}/data"
if [ ! -d "${data}" ] || [ -z "$(ls -A "${data}" 2>/dev/null)" ]; then
    echo "test:conformance: ${data} is missing or empty." >&2
    echo "                  Run: mise run setup:submodules" >&2
    exit 1
fi

# `--nocapture` because the pass/fail counts are the point: the harness prints a
# report cargo would otherwise swallow.
cargo test -p "${crate}" -- --nocapture
'''
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
'''

[tasks."test"]
alias = ["t", "cov", "coverage", "coverage:tarpaulin", "tarpaulin"]
depends = []
depends_post = []
description = "Run the test suite under cargo-tarpaulin. Engine, outputs and ignores live in tarpaulin.toml — the single source of truth. Extra args after `--` pass through to tarpaulin."
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# Expanded with the `+` form: an array-length expansion opens a Tera comment, and
# a bare "${args[@]}" is an unbound-variable error under `set -u` when empty.
eval "args=(${usage_args:-})"

# ONE toolchain instruments everything, and it is PINNED. tarpaulin builds
# doctests with a nightly and resolves the floating `nightly` CHANNEL to do it,
# ignoring RUSTUP_TOOLCHAIN -- so unit tests and doctests were compiled by two
# different compilers and their profraws merged, which broke outright when a
# nightly LLVM bump changed the format. Naming a dated nightly here means one
# compiler and no cross-format merge. To move the pin, bump the date and re-run.
COVERAGE_TOOLCHAIN="${COVERAGE_TOOLCHAIN:-nightly-2026-08-03}"
rustup toolchain install "$COVERAGE_TOOLCHAIN" \
  --profile minimal --component llvm-tools --no-self-update
export RUSTUP_TOOLCHAIN="$COVERAGE_TOOLCHAIN"

# `--all-features`, not a named `<crate>/<feature>`: a feature outside the
# default set is never compiled, so the gate would pass while measuring none of
# the code behind it. Naming the feature instead would hardcode a crate name
# here, which is exactly what went stale.
cargo tarpaulin --workspace --engine llvm \
  --all-features \
  --run-types Tests --run-types Doctests \
  --fail-under "${usage_threshold?}" \
  ${args[@]+"${args[@]}"}
'''
shell = "bash -c"
usage = '''
flag "-t --threshold <threshold>" help="Coverage threshold" default="100" env="RUST_COVERAGE_THRESHOLD"
arg "[args]" var=#true help="Extra arguments forwarded to cargo-tarpaulin (e.g. --out Html)"
'''

[tasks."test:all"]
alias = ["ta"]
depends = []
depends_post = []
description = "Full gate: the coverage suite, then the YAML conformance and round-trip harnesses"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# Expanded with the `+` form: an array-length expansion opens a Tera comment, and
# a bare "${args[@]}" is an unbound-variable error under `set -u` when empty.
eval "args=(${usage_args:-})"

# NO `depends` on test:conformance: that would run it before this body, which runs
# it again -- the whole 402-case suite twice. Calling both here also fixes the
# order: coverage first, conformance second.
if [ -z "${usage_args:-}" ]; then
    mise run test --threshold "${usage_threshold?}"
else
    mise run test --threshold "${usage_threshold?}" -- "${args[@]}"
fi

# No passthrough here. `args` are tarpaulin's (`--out Html` and friends) and
# test:conformance declares no positional arguments, so forwarding them fails
# the whole task with "unexpected word: --out".
mise run test:conformance
'''
shell = "bash -c"
usage = '''
flag "-t --threshold <threshold>" help="Coverage threshold" default="100" env="RUST_COVERAGE_THRESHOLD"
arg "[args]" var=#true help="Extra arguments forwarded to cargo-tarpaulin (e.g. --out Html)"
'''

# The MSRV gate, runnable locally. `test:all` measures on the PINNED toolchain, so
# it can never disagree with the floor Cargo.toml advertises to consumers.
#
# Deliberately NOT tarpaulin and NOT the conformance harness, despite the prefix:
# both live in `publish = false` crates whose dev-only graphs set much higher
# floors. What IS meaningful at the floor is every crate a consumer can install.
#
# performance.yml's `msrv` job holds the same logic and cannot call this task --
# it skips setup-rust-env, which is what puts mise on PATH. Both read Cargo.toml,
# so neither hardcodes the number.
[tasks."test:all:msrv"]
alias = []
description = "Compile and test every PUBLISHABLE crate at the declared MSRV (Cargo.toml `rust-version`), the floor consumers are promised; --check-only stops after the compile gate"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

# Expanded with the `+` form: an array-length expansion opens a Tera comment, and
# a bare "${args[@]}" is an unbound-variable error under `set -u` when empty.
eval "args=(${usage_args:-})"

cd "$(git rev-parse --show-toplevel)"

# READ the floor; never hardcode it. A literal version here would be a second
# source of truth free to disagree with Cargo.toml -- the same class of bug this
# task exists to catch, just relocated into the task runner.
msrv="$(sed -n 's/^rust-version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
if [ -z "$msrv" ]; then
    echo "test:all:msrv: no rust-version in Cargo.toml [workspace.package]" >&2
    exit 1
fi

# Two files declare the floor and must agree: Cargo.toml's `rust-version` is the
# promise to consumers and what this task compiles against; .clippy.toml's `msrv`
# is what makes clippy REJECT an API newer than the floor. A missing key silently
# switches clippy back to assuming the pinned toolchain, so it is failed too.
clippy_msrv="$(sed -n 's/^msrv[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' .clippy.toml | head -n1)"
if [ -z "$clippy_msrv" ]; then
    echo "test:all:msrv: .clippy.toml has no msrv key; it must declare msrv = \"${msrv}\"" >&2
    exit 1
fi
if [ "$clippy_msrv" != "$msrv" ]; then
    echo "test:all:msrv: .clippy.toml msrv \"${clippy_msrv}\" disagrees with Cargo.toml rust-version \"${msrv}\"" >&2
    exit 1
fi

echo "Declared MSRV: ${msrv} (Cargo.toml and .clippy.toml agree)"

# Idempotent: prints "already installed" and exits 0 when it is. `minimal`
# because nothing here needs clippy, rustfmt or the 902 MB of rust-docs.
rustup toolchain install "$msrv" --profile minimal --no-self-update

# Derived rather than an exclude list: cargo reports `publish` as [] for
# `publish = false` and null otherwise, so this selects exactly what a consumer
# can install -- and a crate added tomorrow is covered the day it lands.
names="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.publish != []) | .name' | sort)"
if [ -z "$names" ]; then
    echo "test:all:msrv: no publishable crates resolved; refusing to pass vacuously" >&2
    exit 1
fi
packages=()
while IFS= read -r name; do
    packages+=(--package "$name")
done <<< "$names"

# Selects the toolchain installed above for every cargo/rustc call below; it
# outranks rust-toolchain.toml. This is the override that makes the task mean
# anything.
export RUSTUP_TOOLCHAIN="$msrv"

# REQUIRED, not tidiness. A RUSTFLAGS env var REPLACES .cargo/config.toml's
# per-target `rustflags` rather than merging, so naming `-D warnings` here keeps
# the warning policy byte-for-byte while dropping a linker (mold) a minimal floor
# toolchain has no reason to have. The `lint` gate cannot cover this -- it runs on
# the pinned toolchain.
export RUSTFLAGS="-D warnings"

echo "Using $(rustc --version)"
echo "$names" | sed 's/^/  crate: /'

# `--all-features` because the floor has to hold for every feature a consumer
# can switch on; a default-only run would let an optional dependency raise the
# real MSRV without ever failing here.
cargo check --locked --all-features "${packages[@]}"

if [ "${usage_check_only:-false}" = "true" ]; then
    echo "test:all:msrv: --check-only, stopping after the compile gate"
    exit 0
fi

cargo test --locked --all-features "${packages[@]}" ${args[@]+"${args[@]}"}
'''
shell = "bash -c"
usage = '''
flag "--check-only" help="Stop after the compile gate; do not run the suites at the floor"
flag "-v --verbose" help="Trace each command before running it (set -x)"
arg "[args]" var=#true help="Extra arguments forwarded to cargo test (e.g. -- --nocapture)"
'''

