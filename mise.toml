[tasks."comply:fix"]
alias = []
description = "Add/refresh SPDX headers with `comply annotate` (the WRITE counterpart to the lint-only `comply` task). Takes files or directories; defaults to . (the whole project)"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# `comply lint` only CHECKS; this is the writer. Defaults to `.` -- the whole
# project -- which `--recursive` below then walks. Licence and copyright are not
# passed: REUSE.toml supplies both, and comply treats its own flags as optional
# whenever it does, so there is one source of truth rather than two.
eval "paths=(${usage_paths:-.})"
# Never annotate symlinks -- the per-crate LICENSE-* links point at the shared
# LICENSES/ texts, so `comply annotate` would write THROUGH the link or drop a
# `.license` sidecar.
real=()
for p in "${paths[@]}"; do
    if [ -L "$p" ]; then
        echo "comply:fix: skipping symlink $p" >&2
    else
        real+=("$p")
    fi
done
# Joined-string test, not an array-length expansion: mise renders run blocks as
# Tera templates first, and a brace followed by a hash opens a Tera comment --
# which is why that sequence is never written literally in this file either.
if [ -z "${real[*]:-}" ]; then
    exit 0
fi
# --update-reuse-toml false is the CLI default too, spelled out so this task's
# behaviour is pinned against a future default change. REUSE.toml's `**` aggregate
# already covers these files, and an `override` block would supersede the inline
# header written above.
comply annotate \
    --recursive \
    --force \
    "${real[@]}"
# `annotate` writes header CONTENT but leaves the SHAPE of an existing header;
# only `format` canonicalises shape. Running both is what makes this task agree
# with `comply:format:check` by construction. `--files` takes ONE value per
# occurrence, so the flag is repeated rather than handed a list.
#
# A lone directory goes through `--path`, explicit files through a repeated
# `--files`: the two flags are not interchangeable -- `--files` names source
# files, `--path` names the project root, and `comply format --files .` asks it
# to format a directory as if it were a file. The emptiness test avoids an
# array-length expansion for the Tera reason noted above.
first="${real[0]}"
rest="${real[*]:1}"
if [ -z "$rest" ] && [ -d "$first" ]; then
    comply format --path "$first"
else
    fmt_args=()
    for p in "${real[@]}"; do
        fmt_args+=(--files "$p")
    done
    comply format "${fmt_args[@]}"
fi
'''
shell = "bash -c"
usage = 'arg "[paths]" var=#true help="files or directories to annotate; defaults to . (the whole project) when omitted"'

